<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Tengu Delivery | Comida japonesa na sua porta</title>
<meta content="Tengu Delivery: sushi, hot rolls, temakis e yakisoba entregues quentinhos e na hora. Peça pelo WhatsApp." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&amp;family=Rajdhani:wght@400;500;600;700&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet"/>
<style>
:root{--bg:#05030a;--panel:#0d0813;--red:#ff1f35;--gold:#ffc933;--cyan:#19f0ff;--txt:#efe8da;--mut:#9a90a6;--hd:'Orbitron',sans-serif;--bd:'Rajdhani',system-ui,sans-serif;--br:'Permanent Marker',cursive}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--bd);font-size:18px;line-height:1.5;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
#rain{position:fixed;inset:0;z-index:0;opacity:.35}
#glow{position:fixed;width:480px;height:480px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(255,31,53,.16),transparent 65%);transform:translate(-50%,-50%);left:50%;top:30%}
main,header,footer{position:relative;z-index:2}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;background:linear-gradient(#05030aee,#05030a00);backdrop-filter:blur(6px)}
nav .lg{font-family:var(--hd);font-weight:900;letter-spacing:.12em;color:var(--red);text-shadow:0 0 12px rgba(255,31,53,.7)}
nav .lg span{color:var(--gold);font-weight:500}
nav ul{display:flex;gap:28px;list-style:none;font-weight:600;letter-spacing:.06em}
nav ul a:hover{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.cartbtn{font-family:var(--hd);font-size:13px;border:1px solid var(--gold);color:var(--gold);background:none;padding:10px 16px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.2s}
.cartbtn:hover{background:var(--gold);color:#000;box-shadow:0 0 22px var(--gold)}
/* hero */
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:110px 5vw 60px}
.hero img{width:min(380px,78vw);mix-blend-mode:screen;animation:flick 7s infinite,float 6s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,31,53,.35))}
.hero h1{font-family:var(--hd);font-weight:800;font-size:clamp(22px,4.2vw,46px);letter-spacing:.08em;margin:18px 0 10px;position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
.glitch::before{color:var(--cyan);transform:translateX(-3px);animation:gl 3.2s infinite steps(1);clip-path:inset(0 0 55% 0)}
.glitch::after{color:var(--red);transform:translateX(3px);animation:gl 2.6s infinite steps(1) reverse;clip-path:inset(55% 0 0 0)}
.hero p{max-width:560px;margin:0 auto 30px;color:var(--mut);font-size:20px}
.cta{display:inline-block;font-family:var(--hd);font-weight:800;letter-spacing:.1em;padding:16px 34px;background:var(--red);color:#fff;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 0 30px rgba(255,31,53,.6);transition:.2s;border:0;cursor:pointer;font-size:15px}
.cta:hover{transform:translateY(-3px);background:#ff3a4d}
.cta.ghost{background:none;border:1px solid var(--cyan);color:var(--cyan);box-shadow:none;clip-path:none;margin-left:12px}
.cta.ghost:hover{background:var(--cyan);color:#000}
.type{color:var(--gold);font-family:var(--hd);font-size:14px;letter-spacing:.2em;min-height:22px}
.type::after{content:"▍";animation:bl 1s infinite}
/* marquee */
.mq{border-block:1px solid #2a1630;background:#0a0610;overflow:hidden;white-space:nowrap;padding:14px 0}
.mq div{display:inline-block;animation:mq 28s linear infinite;font-family:var(--hd);font-size:15px;letter-spacing:.2em;color:var(--gold)}
.mq b{color:var(--red);margin:0 26px}
/* sections */
section{padding:96px 5vw;max-width:1200px;margin:0 auto}
h2{font-family:var(--br);font-weight:400;font-size:clamp(40px,7vw,76px);color:var(--red);line-height:1;transform:rotate(-2deg);text-shadow:0 0 22px rgba(255,31,53,.45);margin-bottom:10px}
h2+p{color:var(--mut);margin-bottom:36px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.rv.on{opacity:1;transform:none}
/* menu */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.tab{font-family:var(--hd);font-size:12px;letter-spacing:.1em;padding:10px 18px;background:none;color:var(--txt);border:1px solid #3a2646;cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--gold)}
.tab.act{background:var(--gold);color:#000;border-color:var(--gold);box-shadow:0 0 18px rgba(255,201,51,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{position:relative;background:linear-gradient(160deg,#150b1d,#0b0610);border:1px solid #2f1b3a;padding:24px 22px 20px;display:flex;flex-direction:column;gap:8px;transition:.25s;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.card:hover{border-color:var(--red);transform:translateY(-6px);box-shadow:0 0 30px rgba(255,31,53,.25)}
.card .ic{font-size:40px;filter:drop-shadow(0 0 10px rgba(255,201,51,.6))}
.card h3{font-family:var(--hd);font-size:16px;letter-spacing:.04em}
.card p{color:var(--mut);font-size:16px;flex:1}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-family:var(--hd);font-weight:800;color:var(--gold);font-size:20px;text-shadow:0 0 12px rgba(255,201,51,.5)}
.add{width:42px;height:42px;background:none;border:1px solid var(--red);color:var(--red);font-size:24px;cursor:pointer;transition:.2s}
.add:hover{background:var(--red);color:#fff;box-shadow:0 0 18px var(--red)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.st{border-left:2px solid var(--cyan);padding:6px 0 6px 20px}
.st h3{font-family:var(--hd);font-size:16px;color:var(--cyan);margin-bottom:6px}
.st p{color:var(--mut)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.about .kj{font-size:clamp(110px,20vw,230px);line-height:1;color:transparent;-webkit-text-stroke:2px var(--gold);text-align:center;filter:drop-shadow(0 0 16px rgba(255,201,51,.6));animation:flick 6s infinite}
.about p{color:var(--mut);margin-bottom:14px}
.about strong{color:var(--txt)}
.contact{text-align:center}
.contact h2{transform:none}
.contact .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer{border-top:1px solid #2a1630;text-align:center;padding:34px 5vw 44px;color:var(--mut);font-size:16px}
footer a{color:var(--gold);font-weight:700}
footer a:hover{text-shadow:0 0 12px var(--gold)}
/* cart */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#0a0610f5;border-left:1px solid var(--red);z-index:80;transform:translateX(105%);transition:transform .35s;display:flex;flex-direction:column;padding:22px;box-shadow:-10px 0 50px rgba(255,31,53,.25)}
#drawer.open{transform:none}
#drawer h3{font-family:var(--hd);color:var(--gold);display:flex;justify-content:space-between;margin-bottom:16px}
#drawer h3 button{background:none;border:0;color:var(--txt);font-size:26px;cursor:pointer}
#items{flex:1;overflow:auto}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #2a1630}
.it small{color:var(--gold);display:block;font-family:var(--hd)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;background:none;border:1px solid #4a3158;color:var(--txt);cursor:pointer}
.q button:hover{border-color:var(--gold)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
.tot{display:flex;justify-content:space-between;font-family:var(--hd);font-size:18px;margin:16px 0}
#drawer input,#drawer textarea{width:100%;background:#150b1d;border:1px solid #3a2646;color:var(--txt);padding:10px;margin-bottom:8px;font:inherit}
#drawer .cta{width:100%;text-align:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--gold);color:#000;font-family:var(--hd);font-size:13px;padding:12px 20px;z-index:99;transition:.3s}
#toast.on{transform:translate(-50%,0)}
@keyframes gl{0%,90%,100%{opacity:0}92%{opacity:1;transform:translateX(-5px)}95%{opacity:1;transform:translateX(5px)}}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes bl{50%{opacity:0}}
@keyframes mq{to{transform:translateX(-50%)}}
@media(max-width:760px){nav ul{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;gap:0;background:#0a0610f7;border-top:1px solid var(--red);padding:12px 0;font-size:15px}footer{padding-bottom:90px}#toast{bottom:80px}.two{grid-template-columns:1fr!important}.about{grid-template-columns:1fr}.cta.ghost{margin:14px 0 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}#rain{display:none}}

.pg{display:none}.pg.show{display:block}.hero.pg.show{display:grid}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--red),var(--gold));z-index:99;box-shadow:0 0 12px var(--red)}
#wipe{position:fixed;inset:0;z-index:95;pointer-events:none;transform:translateX(-101%);background:repeating-linear-gradient(135deg,var(--red) 0 24px,#8a0010 24px 48px)}
#wipe.go{animation:wp .65s}
@keyframes wp{0%{transform:translateX(-101%)}45%,55%{transform:none}100%{transform:translateX(101%)}}
nav ul a.cur{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.stt{font-family:var(--hd);font-size:12px;letter-spacing:.18em;margin:6px 0 16px!important}
.stt i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--mut)}
.stt.on i{background:#2dff7a;box-shadow:0 0 12px #2dff7a}.stt.on{color:#2dff7a!important}
.card .tg{position:absolute;top:14px;right:30px;font-family:var(--hd);font-size:10px;letter-spacing:.12em;color:#000;background:var(--red);padding:3px 8px}
.card{transition:border-color .25s,box-shadow .25s,transform .12s}
.bus{width:100%;max-width:420px;background:#150b1d;border:1px solid #3a2646;color:var(--txt);padding:12px 16px;font:inherit;margin-bottom:20px}
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-bottom:34px}
.pr .card.hj{border-color:var(--cyan);box-shadow:0 0 28px rgba(25,240,255,.25)}
.pr .tg{background:var(--cyan)}
.cd{font-family:var(--hd);font-size:clamp(28px,6vw,54px);color:var(--cyan);text-shadow:0 0 20px var(--cyan);margin:6px 0 34px}
.cp{display:flex;flex-wrap:wrap;gap:16px;align-items:center;border:1px dashed var(--gold);padding:22px;background:#0d0813}
.cp b{font-family:var(--hd);font-size:26px;color:var(--gold);letter-spacing:.14em}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:50px}
.vals div{border:1px solid #2f1b3a;padding:22px;background:#0d0813}
.vals h3{font-family:var(--hd);font-size:15px;color:var(--gold);margin-bottom:8px}
.vals p{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:46px}
.two h3,.faq h3{font-family:var(--hd);color:var(--gold);font-size:16px;margin-bottom:12px}
.hr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a1630;color:var(--mut)}
.hr.td{color:var(--cyan);font-weight:700}
.ar{display:flex;flex-wrap:wrap;gap:8px}.ar span{border:1px solid #3a2646;padding:6px 12px;color:var(--mut)}
.fm input,.fm textarea{width:100%;background:#150b1d;border:1px solid #3a2646;color:var(--txt);padding:12px;margin-bottom:10px;font:inherit}
details{border-bottom:1px solid #2a1630;padding:14px 0}
summary{cursor:pointer;font-weight:700;list-style:none}summary::before{content:"▸ ";color:var(--red)}details[open] summary::before{content:"▾ "}
details p{color:var(--mut);margin-top:8px}
#wipe.in{animation:wi .6s}@keyframes wi{0%{transform:none}100%{transform:translateX(101%)}}

/* INTRO SPLASH */
#intro{
  position:fixed;inset:0;z-index:200;
  display:grid;place-items:center;gap:26px;
  grid-auto-flow:row;
  padding:24px;text-align:center;
  background:radial-gradient(circle at 50% 40%,#1a0715 0%,#05030a 70%);
  opacity:1;visibility:visible;
  transition:opacity .6s ease,visibility .6s ease;
}
#intro::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);
}
#intro img{
  max-width:min(520px,80vw);max-height:65vh;width:auto;height:auto;
  filter:drop-shadow(0 0 40px rgba(255,31,53,.55));
  animation:float 4s ease-in-out infinite;
}
#intro button{
  font-family:var(--hd);font-weight:800;letter-spacing:.14em;font-size:14px;
  padding:14px 28px;border:0;cursor:pointer;
  background:var(--red);color:#fff;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  box-shadow:0 0 30px rgba(255,31,53,.55);
  transition:transform .2s,background .2s;
}
#intro button:hover{background:#ff3a4d;transform:translateY(-2px)}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
body.intro-active{overflow:hidden}
@media(prefers-reduced-motion:reduce){#intro img{animation:none}}
</style>
</head>
